name: Telegram Channel Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram channel test report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN is missing")
          if not chat_id:
              raise SystemExit("TELEGRAM_CHAT_ID is missing")

          text = (
              "🧪 Crypto Scanner — Telegram Channel Test\n\n"
              "Status: TEST MESSAGE SENT\n"
              f"Target: {chat_id}\n"
              "Source: GitHub Actions\n"
              "Purpose: Verify Telegram channel delivery after username update."
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
          }).encode()

          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  result = json.loads(body)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"TELEGRAM HTTP ERROR {exc.code}: {body}")
              raise SystemExit(1)

          if not result.get("ok"):
              print("TELEGRAM API ERROR:", body)
              raise SystemExit(1)

          print("TELEGRAM TEST SUCCESS")
          print("message_id:", result.get("result", {}).get("message_id"))
          PY
