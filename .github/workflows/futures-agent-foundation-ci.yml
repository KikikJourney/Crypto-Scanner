name: Futures Agent Foundation CI\n\non:\n  pull_request:\n    paths:\n      - 'autonomous_futures_agent/**'\n      - '.github/workflows/futures-agent-foundation-ci.yml'\n  push:\n    branches: [main]\n    paths:\n      - 'autonomous_futures_agent/**'\n      - '.github/workflows/futures-agent-foundation-ci.yml'\n\npermissions:\n  contents: read\n\njobs:\n  unit-tests:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Run risk and fail-closed tests\n        run: python -m unittest discover -s autonomous_futures_agent/tests -v\n