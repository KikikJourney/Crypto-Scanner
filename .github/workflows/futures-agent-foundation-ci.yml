name: Futures Agent Foundation CI

on:
  pull_request:
    paths:
      - 'autonomous_futures_agent/**'
      - '.github/workflows/futures-agent-foundation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'autonomous_futures_agent/**'
      - '.github/workflows/futures-agent-foundation-ci.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run risk and fail-closed tests
        run: python -m unittest discover -s autonomous_futures_agent/tests -v
