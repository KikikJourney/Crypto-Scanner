name: Zorathvael Scanner Council

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scanner_council.py'
      - '.github/workflows/reversal-scanner.yml'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: zorathvael-scanner-council
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Council engine
        run: python -m py_compile scanner_council.py
      - name: Diagnose runner network
        run: |
          echo "Runner egress:"
          curl -4 -sS --max-time 10 https://ipconfig.io/json || true
          echo
          echo "Bitget Futures preflight:"
          curl -4 -sS -D /tmp/binance_headers -o /tmp/binance_body --max-time 15 https://api.bitget.com/api/v2/mix/market/tickers?productType=USDT-FUTURES || true
          echo "Headers:"
          sed -n '1,20p' /tmp/binance_headers 2>/dev/null || true
          echo "Body:"
          head -c 300 /tmp/binance_body 2>/dev/null || true
          echo
      - name: Run Scanner Council
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BITGET_BASE_URL: https://api.bitget.com
          FREETHEAI_API_KEY: ${{ secrets.FREETHEAI_API_KEY }}
          FREETHEAI_MODEL: fta/zai/glm-5.3
        run: python scanner_council.py | tee scanner_result.json
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scanner-council-result
          path: scanner_result.json
          if-no-files-found: warn
          retention-days: 3
