name: Gemini Alpha Edge Crypto Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'alpha_edge_engine.py'
      - 'gemini_market_screen.py'
      - 'telegram_signal_dedup.py'
      - 'tests/test_telegram_signal_dedup.py'
      - 'tests/test_gemini_market_screen.py'
      - 'scanner_council.py'
      - 'tests/test_alpha_edge_engine.py'
      - '.github/workflows/reversal-scanner.yml'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: zorathvael-alpha-edge-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lightweight runtime dependency
        run: python -m pip install 'requests>=2.32,<3'
      - name: Validate engine
        run: |
          python -m py_compile alpha_edge_engine.py scanner_council.py gemini_market_screen.py
          python -m unittest -v tests/test_alpha_edge_engine.py tests/test_gemini_market_screen.py
      - name: Market transport preflight
        run: |
          echo "Bitget Futures:"
          curl -4 -sS --max-time 15 'https://api.bitget.com/api/v3/market/tickers?category=USDT-FUTURES' | head -c 500
          echo
      - name: Run Alpha Edge Scanner
        env:
          DEFER_TELEGRAM: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          EDGE_EXCLUDED_SYMBOLS: BTCUSDT,MSTRUSDT
          BINANCE_BASE_URL: https://fapi.binance.com
          BITGET_BASE_URL: https://api.bitget.com
          QWEN_MODEL_ID: Qwen/Qwen3-0.6B
          QWEN_SCREEN_SYMBOLS: 24
          QWEN_MAX_PICKS: 6
          GEMINI_ONLY: "1"
        run: python scanner_council.py | tee scanner_result.log
      - name: Fingerprint actionable signal batch
        id: signal
        if: success()
        run: |
          python - <<'PY'
          import datetime, json, os
          from telegram_signal_dedup import signal_fingerprint
          result = json.load(open("scanner_result.json", encoding="utf-8"))
          rows = result.get("results", [])
          fingerprint = signal_fingerprint(rows)
          day = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"fingerprint={fingerprint}\n")
              out.write(f"day={day}\n")
          print(f"TELEGRAM_FINGERPRINT status={'actionable' if rows else 'no_actionable_signals'} count={len(rows)} fingerprint={fingerprint}")
          PY
      - name: Restore Telegram duplicate-suppression cache
        id: telegram-dedup
        if: steps.signal.outputs.fingerprint != 'none'
        uses: actions/cache@v4
        with:
          path: .telegram-signal-dedup
          key: telegram-signal-${{ steps.signal.outputs.day }}-${{ steps.signal.outputs.fingerprint }}
          restore-keys: |
            telegram-signal-${{ steps.signal.outputs.day }}-
      - name: Filter previously sent signals
        id: pending
        if: steps.signal.outputs.fingerprint != 'none'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from telegram_signal_dedup import filter_new_signals, migrate_legacy_batch
          result = json.load(open("scanner_result.json", encoding="utf-8"))
          rows = result.get("results", [])
          state = Path(".telegram-signal-dedup")
          seen_path = state / "seen.json"
          legacy_marker = state / "fingerprint"
          migration = False
          if seen_path.exists():
              seen = set(json.loads(seen_path.read_text(encoding="utf-8")))
              pending, updated = filter_new_signals(rows, seen)
          elif legacy_marker.exists():
              # Only suppress the exact legacy batch. If membership changed, there
              # is no per-signal delivery history, so send it rather than permanently
              # marking potentially unsent signals as delivered.
              legacy_fingerprint = legacy_marker.read_text(encoding="utf-8").strip()
              pending, updated, migration = migrate_legacy_batch(rows, legacy_fingerprint)
          else:
              pending, updated = filter_new_signals(rows, set())
          Path("scanner_pending.json").write_text(json.dumps({"results": pending}, ensure_ascii=False), encoding="utf-8")
          Path("scanner_seen_next.json").write_text(json.dumps(sorted(updated), ensure_ascii=False), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"pending_count={len(pending)}\n")
              out.write(f"migration={'true' if migration else 'false'}\n")
          print(f"TELEGRAM_PENDING count={len(pending)} seen={len(updated)} migration={migration}")
          PY
      - name: Send new Telegram signals
        if: steps.signal.outputs.fingerprint != 'none' && steps.pending.outputs.pending_count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          from alpha_edge_engine import notify
          result = json.load(open("scanner_pending.json", encoding="utf-8"))
          if not notify(result):
              raise SystemExit("Telegram delivery was skipped; credentials or actionable results missing")
          PY
      - name: Mark Telegram signal batch as sent
        if: steps.signal.outputs.fingerprint != 'none' && steps.pending.outputs.pending_count != '0'
        run: |
          mkdir -p .telegram-signal-dedup
          cp scanner_seen_next.json .telegram-signal-dedup/seen.json
          printf '%s\n' '${{ steps.signal.outputs.fingerprint }}' > .telegram-signal-dedup/fingerprint
      - name: Migrate legacy Telegram cache without resending
        if: steps.signal.outputs.fingerprint != 'none' && steps.pending.outputs.migration == 'true'
        run: |
          mkdir -p .telegram-signal-dedup
          cp scanner_seen_next.json .telegram-signal-dedup/seen.json
          printf '%s\n' '${{ steps.signal.outputs.fingerprint }}' > .telegram-signal-dedup/fingerprint
      - name: Log duplicate Telegram signal suppression
        if: steps.signal.outputs.fingerprint != 'none' && steps.pending.outputs.pending_count == '0'
        run: echo "TELEGRAM_DEDUP_SKIP fingerprint=${{ steps.signal.outputs.fingerprint }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: alpha-edge-scanner-result
          path: |
            scanner_result.json
            scanner_result.log
          if-no-files-found: warn
          retention-days: 7
