name: Zorathvael Dynamic Futures Scanner

on:
  push:
    paths:
      - 'scanner_v2.py'
      - 'universe_runner.py'
      - 'diagnostic_v21.py'
      - '.github/workflows/reversal-scanner.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: zorathvael-dynamic-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate scanner syntax
        run: python -m py_compile scanner_v2.py universe_runner.py diagnostic_v21.py

      - name: Validate diagnostic layer
        run: python diagnostic_v21.py

      - name: Run dynamic futures scanner
        run: python universe_runner.py

      - name: Validate watchlist CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('data/universe_watchlist.csv')
          assert p.exists(), 'watchlist CSV missing'
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert rows, 'watchlist CSV is empty'
          assert all(None not in r for r in rows), 'unexpected CSV fields detected'
          required = {
              'long_score','short_score','score_gap_to_70','bias','diagnostic_status','blocker',
              'long_blocker','short_blocker','long_location','long_exhaustion','long_flow',
              'long_reclaim','long_expansion','short_location','short_exhaustion','short_flow',
              'short_reject','short_expansion'
          }
          assert required.issubset(rows[0]), 'V2.1 side-component fields missing'
          print(f'WATCHLIST CSV VALID: {len(rows)} rows; V2.1 side-component diagnostics present')
          PY

      - name: Persist scanner and forward-test data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner_v2.py universe_runner.py diagnostic_v21.py data/reversal_forward_test.csv data/universe_watchlist.csv
          git diff --cached --quiet || git commit -m 'Update dynamic scanner diagnostics and forward-test data'
          git push origin HEAD:main
