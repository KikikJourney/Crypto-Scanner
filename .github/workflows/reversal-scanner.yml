name: Zorathvael Alpha Edge Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'alpha_edge_engine.py'
      - 'scanner_council.py'
      - 'tests/test_alpha_edge_engine.py'
      - '.github/workflows/reversal-scanner.yml'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: zorathvael-alpha-edge-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate engine
        run: |
          python -m py_compile alpha_edge_engine.py scanner_council.py
          python -m unittest -v tests/test_alpha_edge_engine.py
      - name: Binance preflight
        run: |
          curl -4 -sS --max-time 15 'https://fapi.binance.com/fapi/v1/ping'
          echo
          curl -4 -sS --max-time 15 'https://fapi.binance.com/fapi/v1/ticker/price?symbol=BTCUSDT'
      - name: Run Alpha Edge Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_BASE_URL: https://fapi.binance.com
          BITGET_BASE_URL: https://api.bitget.com
        run: python scanner_council.py | tee scanner_result.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: alpha-edge-scanner-result
          path: |
            scanner_result.json
            scanner_result.log
          if-no-files-found: warn
          retention-days: 7
