name: Zorathvael Dynamic Futures Scanner
# CI gate: scalping intelligence tests must pass before live scan/persistence. Risk fixture aligned with location and reversal gates.

on:
  push:
    branches: [main]
    paths:
      - 'scanner_v2.py'
      - 'universe_runner.py'
      - 'diagnostic_v21.py'
      - 'early_reversal_layer.py'
      - 'extreme_reversal_layer.py'
      - 'extreme_market_data.py'
      - 'extreme_runner.py'
      - 'extreme_event_stats.py'
      - 'actionable_reversal_layer.py'
      - 'actionable_forward_test.py'
      - 'scalping_execution_layer.py'
      - 'scalping_intelligence.py'
      - 'early_reversal_engine.py'
      - 'scalping_forward_test.py'
      - 'telegram_notifier.py'
      - 'send_telegram_actions.py'
      - 'signal_funnel_diagnostic.py'
      - 'scalping_optimizer.py'
      - 'validation_gate.py'
      - 'evidence_audit.py'
      - 'execution_calibration.py'
      - 'tests/test_validation_gate.py'
      - 'tests/test_evidence_audit.py'
      - 'tests/test_execution_calibration.py'
      - 'tests/test_signal_funnel_diagnostic.py'
      - 'tests/test_scalping_optimizer.py'
      - 'tests/test_scalping_forward_test.py'
      - 'tests/test_early_reversal.py'
      - 'tests/test_early_reversal_engine.py'
      - 'tests/test_extreme_reversal.py'
      - 'tests/test_actionable_reversal.py'
      - 'tests/test_actionable_forward_test.py'
      - 'tests/test_actionable_confirmation_window.py'
      - 'tests/test_scalping_execution.py'
      - 'tests/test_scalping_intelligence.py'
      - 'tests/test_scalping_forward_test.py'
      - 'tests/test_telegram_notifier.py'
      - '.github/workflows/reversal-scanner.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: zorathvael-dynamic-scanner
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m py_compile scanner_v2.py universe_runner.py diagnostic_v21.py early_reversal_layer.py extreme_reversal_layer.py extreme_market_data.py extreme_runner.py extreme_event_stats.py actionable_reversal_layer.py actionable_forward_test.py scalping_execution_layer.py scalping_intelligence.py early_reversal_engine.py scalping_forward_test.py telegram_notifier.py send_telegram_actions.py signal_funnel_diagnostic.py scalping_optimizer.py evidence_audit.py
      - name: Validate diagnostic
        run: python diagnostic_v21.py
      - name: Validate crypto-only universe filters
        run: |
          python - <<'PY'
          import universe_runner as u
          from unittest.mock import patch

          bitget = {
              "data": [
                  {"symbol": "BTCUSDT", "quoteCoin": "USDT", "type": "perpetual", "status": "online", "symbolType": "crypto"},
                  {"symbol": "AAPLUSDT", "quoteCoin": "USDT", "type": "perpetual", "status": "online", "symbolType": "stock"},
                  {"symbol": "XAUUSDT", "quoteCoin": "USDT", "type": "perpetual", "status": "online", "symbolType": "metal"},
                  {"symbol": "CLUSDT", "quoteCoin": "USDT", "type": "perpetual", "status": "online", "symbolType": "commodity"},
              ]
          }
          with patch.object(u.core, "bitget", return_value=bitget):
              assert u.active_bitget_symbols() == ["BTCUSDT"]

          binance = {
              "symbols": [
                  {"symbol": "BTCUSDT", "status": "TRADING", "contractType": "PERPETUAL", "quoteAsset": "USDT",
                   "underlyingType": "COIN", "underlyingSubType": ["Layer-1", "Crypto"]},
                  {"symbol": "AAPLUSDT", "status": "TRADING", "contractType": "PERPETUAL", "quoteAsset": "USDT",
                   "underlyingType": "EQUITY", "underlyingSubType": ["TradFi"]},
                  {"symbol": "SPYUSDT", "status": "TRADING", "contractType": "PERPETUAL", "quoteAsset": "USDT",
                   "underlyingType": "INDEX", "underlyingSubType": ["TradFi"]},
              ]
          }
          with patch.object(u.core, "binance", return_value=binance):
              assert u.active_binance_symbols() == ["BTCUSDT"]

          bybit = {
              "result": {
                  "list": [
                      {"symbol": "BTCUSDT", "status": "Trading", "quoteCoin": "USDT", "contractType": "LinearPerpetual",
                       "marketRegion": "", "underlyingTicker": ""},
                      {"symbol": "AAPLUSDT", "status": "Trading", "quoteCoin": "USDT", "contractType": "LinearPerpetual",
                       "marketRegion": "US", "underlyingTicker": "AAPL"},
                      {"symbol": "XAUUSDT", "status": "Trading", "quoteCoin": "USDT", "contractType": "LinearPerpetual",
                       "marketRegion": "US", "underlyingTicker": "XAUUSD"},
                  ],
                  "nextPageCursor": "",
              }
          }
          with patch.object(u.core, "bybit", return_value=bybit):
              assert u.active_bybit_symbols() == ["BTCUSDT"]

          print("Crypto-only universe filter tests PASSED")
          PY
      - name: Validate Early Reversal
        run: python -m unittest discover -s tests -p 'test_early_reversal.py' -v
      - name: Validate Extreme Reversal
        run: python -m unittest discover -s tests -p 'test_extreme_reversal.py' -v
      - name: Validate Actionable Reversal
        run: python -m unittest discover -s tests -p 'test_actionable_reversal.py' -v
      - name: Validate Actionable forward-test logic
        run: python -m unittest discover -s tests -p 'test_actionable_forward_test.py' -v
      - name: Validate Actionable confirmation window
        run: python -m unittest discover -s tests -p 'test_actionable_confirmation_window.py' -v
      - name: Validate Scalping execution
        run: python -m unittest discover -s tests -p 'test_scalping_execution.py' -v
      - name: Validate Scalping intelligence
        run: python -m unittest discover -s tests -p 'test_scalping_intelligence.py' -v
      - name: Validate Early Reversal Engine
        run: python -m unittest discover -s tests -p 'test_early_reversal_engine.py' -v
      - name: Build optimization report
        run: python scalping_optimizer.py
      - name: Build statistical validation report
        run: python validation_gate.py
      - name: Validate Scalping Optimizer
        run: python -m unittest discover -s tests -p 'test_scalping_optimizer.py' -v
      - name: Validate Scalping forward-test
        run: python -m unittest discover -s tests -p 'test_scalping_forward_test.py' -v
      - name: Validate statistical evidence gate
        run: python -m unittest discover -s tests -p 'test_validation_gate.py' -v
      - name: Validate forward-test evidence audit
        run: python -m unittest discover -s tests -p 'test_evidence_audit.py' -v
      - name: Validate execution calibration
        run: python -m unittest discover -s tests -p 'test_execution_calibration.py' -v
      - name: Validate Signal Funnel Diagnostic
        run: python -m unittest discover -s tests -p 'test_signal_funnel_diagnostic.py' -v
      - name: Validate Telegram formatter
        run: python -m unittest discover -s tests -p 'test_telegram_notifier.py' -v
      - name: Run V2.2 extreme reversal scanner
        run: python extreme_runner.py
      - name: Send confirmed scalping actions to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram_actions.py
      - name: Validate generated datasets
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          def read(path):
              with Path(path).open(newline='',encoding='utf-8') as f: return list(csv.DictReader(f))
          def check(path, required):
              p=Path(path); assert p.exists(), f'{path} missing'; rows=read(path); assert required <= set(rows[0] if rows else required); return rows
          extreme=check('data/extreme_reversal_forward_test.csv', {'id','timestamp','symbol','direction','score','price','atr_pct','trigger','action_stop','action_target','action_risk_pct','action_reward_r','event_id','event_role','h1','h4','h12','h24'})
          if extreme:
              ids={r['event_id'] for r in extreme}; primary={r['event_id'] for r in extreme if r['event_role']=='PRIMARY'}
              assert all(r['event_id'] for r in extreme) and all(r['event_role'] in {'PRIMARY','DUPLICATE'} for r in extreme) and ids==primary
          snapshots=check('data/extreme_market_snapshots.csv', {'id','timestamp','symbol','provider','price'})
          actionable=check('data/actionable_forward_test.csv', {'id','timestamp','symbol','provider','direction','extreme_event_id','entry','stop','target','risk_pct','reward_r','source_extreme_score','event_id','event_role','h1','h4','h12','h24'})
          if actionable:
              ids={r['event_id'] for r in actionable}; primary={r['event_id'] for r in actionable if r['event_role']=='PRIMARY'}
              assert all(r['event_id'] for r in actionable) and all(r['event_role'] in {'PRIMARY','DUPLICATE'} for r in actionable) and ids==primary
              assert all(float(r['entry'])>0 and float(r['stop'])>0 and float(r['target'])>0 for r in actionable)
          actions=check('data/actionable_signals.csv', {'id','timestamp','scan_timestamp','symbol','provider','direction','score','v2_score','confidence','location_15m','reversal_5m','entry','entry_low','entry_high','trigger','stop','target','risk_pct','reward_r','valid_until','latest_closed_5m_timestamp','latest_closed_15m_timestamp','data_age_seconds','timeframes','reason'})
          if actions:
              assert all(r['direction'] in {'LONG','SHORT'} for r in actions)
              assert all(0 <= float(r['confidence']) <= 100 for r in actions)
              assert all(float(r['score']) == float(r['v2_score']) for r in actions)
              assert all(float(r['data_age_seconds']) >= 0 and float(r['data_age_seconds']) <= 900 for r in actions)
              assert all(r['latest_closed_5m_timestamp'] and r['latest_closed_15m_timestamp'] for r in actions)
              assert all(float(r['entry_low']) <= float(r['entry_high']) for r in actions)
              assert all(0.0 <= float(r['early_reversal_score']) <= 1.0 for r in actions)
          funnel=check('data/signal_funnel_summary.csv', {'timestamp','provider','universe','deep_scan','data_valid','data_errors','direction_long','direction_short','no_direction','alignment_failed','location_failed','reversal_failed','confidence_failed','risk_failed','actions'})
          funnel_symbols=check('data/signal_funnel_symbols.csv', {'timestamp','symbol','provider','stage','direction','confidence','alignment','reason'})
          optimization=check('data/scalping_optimization_report.csv', {'dimension','bucket','resolved','expansion','fail','ambiguous','expansion_rate','fail_rate','min_sample_for_review'})
          scalping=check('data/scalping_forward_test.csv', {'id','timestamp','symbol','provider','direction','score','v2_score','confidence','strategy_version','location_15m','reversal_5m','exhaustion_15m','base_15m','structure_shift_5m','reversal_trigger_5m','early_reversal_score','entry','stop','target','risk_pct','reward_r','h15','h30','h60','h120','first_touch','first_touch_timestamp','resolved_horizon','outcome_r'})
          if scalping:
              assert all(r['strategy_version'] == 'scalp-structure-v1' for r in scalping), 'legacy scalping evidence leaked into current forward-test'
              assert all(r['direction'] in {'LONG','SHORT'} for r in scalping)
              assert all(float(r['entry'])>0 and float(r['stop'])>0 and float(r['target'])>0 for r in scalping)
              assert all(r['first_touch'] in {'', 'EXPANSION', 'FAIL', 'AMBIGUOUS'} for r in scalping)
              assert all(r['first_touch'] == '' or r['first_touch_timestamp'] for r in scalping)
              assert all(r['resolved_horizon'] in {'', '15', '30', '60', '120'} for r in scalping)
              assert all(r['outcome_r'] in {'', '-1.0', '2.0'} for r in scalping)
              assert all((not r['first_touch']) == (not r['outcome_r']) for r in scalping)
          funnel_action_pairs={(r['symbol'],r['direction']) for r in funnel_symbols if r.get('stage')=='ACTION'}
          action_pairs={(r['symbol'],r['direction']) for r in actions}
          assert action_pairs <= funnel_action_pairs
          assert len(action_pairs) == min(len(funnel_action_pairs), 20)
          print(f'VALID: extreme={len(extreme)}, snapshots={len(snapshots)}, confirmed_actions={len(actionable)}, telegram_queue={len(actions)}, scalping_forward_test={len(scalping)}, funnel_runs={len(funnel)}, funnel_symbols={len(funnel_symbols)}')
          PY
      - name: Archive exact run datasets
        uses: actions/upload-artifact@v4
        with:
          name: scanner-run-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            data/actionable_signals.csv
            data/signal_funnel_summary.csv
            data/signal_funnel_symbols.csv data/scalping_execution_calibration_report.csv data/scalping_execution_calibration.csv
            data/scalping_forward_test.csv
            data/scalping_action_history.csv
            data/scalping_market_5m.csv
            data/extreme_market_snapshots.csv
            data/extreme_reversal_forward_test.csv
            data/actionable_forward_test.csv
            data/scalping_optimization_report.csv

      - name: Persist scanner and forward-test data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          # The scanner generates a new snapshot, but two files are persistent state:
          # action history and the 5m market archive. Never resolve a rebase conflict
          # by replacing either file wholesale; that silently destroys prior samples.
          # Instead, snapshot this run's generated data, reset to the latest main,
          # then merge the append-only state by stable ID.
          STATE_DIR="$(mktemp -d)"
          cp -R data "$STATE_DIR/data"
          git reset --hard origin/main
          export SCANNER_STATE_DIR="$STATE_DIR/data"
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          state = Path(os.environ["SCANNER_STATE_DIR"])
          root = Path("data")
          persistent = {
              "scalping_action_history.csv": "id",
              "scalping_market_5m.csv": "id",
          }

          def read(path):
              if not path.exists():
                  return [], []
              with path.open(newline="", encoding="utf-8") as f:
                  reader = csv.DictReader(f)
                  return list(reader), reader.fieldnames or []

          def write(path, fields, rows):
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open("w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  w.writerows(rows)

          for name, key in persistent.items():
              current_rows, current_fields = read(state / name)
              upstream_rows, upstream_fields = read(root / name)
              fields = current_fields or upstream_fields
              merged = {row.get(key): row for row in upstream_rows if row.get(key)}
              merged.update({row.get(key): row for row in current_rows if row.get(key)})
              write(root / name, fields, sorted(merged.values(), key=lambda r: r.get("timestamp", "")))

          # The crypto-only universe is part of the state boundary for forward-test
          # filtering. Persist it across the reset before recomputing history.
          if (state / "crypto_universe.csv").exists():
              (root / "crypto_universe.csv").write_bytes((state / "crypto_universe.csv").read_bytes())

          # All other generated datasets represent this exact scan and can replace
          # the older snapshot after the reset.
          for path in (state / "actionable_signals.csv",
                       state / "signal_funnel_summary.csv",
                       state / "signal_funnel_symbols.csv",
                       state / "scalping_optimization_report.csv",
                       state / "scalping_validation_report.csv",
                       state / "extreme_market_snapshots.csv",
                       state / "extreme_reversal_forward_test.csv",
                       state / "actionable_forward_test.csv",
                       state / "universe_watchlist.csv",
                       state / "telegram_sent_actions.csv"):
              if path.exists():
                  target = root / path.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(path.read_bytes())

          # Recompute the forward-test from the merged persistent history and market
          # archive. This guarantees the committed report includes older actions and
          # newly completed horizons, rather than only the current scan's actions.
          import scalping_forward_test as ft
          rows = ft.evaluate()
          import scalping_optimizer as optimizer
          optimizer.write(rows)
          import validation_gate
          validation_gate.write(rows)
          import evidence_audit
          evidence_audit.write(rows)
          import execution_calibration
          calibration = execution_calibration.write()
          print('Execution calibration shadow:', calibration)
          eligible = {str(r.get("symbol", "")).upper() for r in read(root / "crypto_universe.csv")[0] if r.get("symbol")}
          assert eligible, "crypto_universe.csv missing or empty after state reset"
          assert all(str(r.get("symbol", "")).upper() in eligible for r in read(root / "scalping_action_history.csv")[0]), "non-crypto symbol survived action-history migration"
          assert all(str(r.get("symbol", "")).upper() in eligible for r in rows), "non-crypto symbol survived forward-test"
          print(ft.format_summary(rows))
          PY

          git add data/reversal_forward_test.csv data/scalping_action_history.csv data/scalping_market_5m.csv data/crypto_universe.csv data/early_reversal_forward_test.csv data/extreme_reversal_forward_test.csv data/extreme_market_snapshots.csv data/actionable_forward_test.csv data/scalping_forward_test.csv data/scalping_optimization_report.csv data/scalping_validation_report.csv data/scalping_evidence_audit.csv data/scalping_execution_calibration_report.csv data/scalping_execution_calibration.csv data/universe_watchlist.csv data/actionable_signals.csv data/telegram_sent_actions.csv data/signal_funnel_summary.csv data/signal_funnel_symbols.csv
          git diff --cached --quiet || git commit -m 'chore: persist scanner datasets'
          git push origin HEAD:main
