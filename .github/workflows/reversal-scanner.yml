name: Zorathvael Dynamic Futures Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: zorathvael-dynamic-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate scanner syntax
        run: python -m py_compile scanner_v2.py universe_runner.py

      - name: Run dynamic futures scanner
        run: python universe_runner.py

      - name: Validate watchlist CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('data/universe_watchlist.csv')
          assert p.exists(), 'watchlist CSV missing'
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert rows, 'watchlist CSV is empty'
          assert all(None not in r for r in rows), 'unexpected CSV fields detected'
          print(f'WATCHLIST CSV VALID: {len(rows)} rows')
          PY

      - name: Persist scanner and forward-test data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner_v2.py universe_runner.py data/reversal_forward_test.csv data/universe_watchlist.csv
          git diff --cached --quiet || git commit -m 'Scan dynamic futures universe and build watchlist'
          git push origin HEAD:main
