name: Zorathvael Qwen Alpha Hunter Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'alpha_edge_engine.py'
      - 'scanner_council.py'
      - 'tests/test_alpha_edge_engine.py'
      - '.github/workflows/reversal-scanner.yml'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: zorathvael-alpha-edge-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Hugging Face Kronos engine
        run: |
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git .vendor/kronos
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen-kronos-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            qwen-kronos-${{ runner.os }}-
      - name: Validate engine
        run: |
          python -m py_compile alpha_edge_engine.py scanner_council.py
          python -m unittest -v tests/test_alpha_edge_engine.py
          python - <<'PY'
          import sys
          sys.path.insert(0, ".vendor/kronos")
          from model import Kronos, KronosTokenizer, KronosPredictor
          print("KRONOS_IMPORT_OK")
          PY
      - name: Market transport preflight
        run: |
          echo "Bitget Futures:"
          curl -4 -sS --max-time 15 'https://api.bitget.com/api/v3/market/tickers?category=USDT-FUTURES' | head -c 500
          echo
      - name: Run Alpha Edge Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_BASE_URL: https://fapi.binance.com
          BITGET_BASE_URL: https://api.bitget.com
          AI_MODEL_ID: NeoQuasar/Kronos-small
          QWEN_MODEL_ID: Qwen/Qwen3-0.6B
          QWEN_SCREEN_SYMBOLS: 12
          QWEN_MAX_PICKS: 6
          AI_TOKENIZER_ID: NeoQuasar/Kronos-Tokenizer-base
          KRONOS_VENDOR_PATH: .vendor/kronos
          AI_ON_QWEN_CANDIDATES: "0"
          AI_CONTEXT: 192
          AI_HORIZON: 8
          AI_SAMPLES: 1
        run: python scanner_council.py | tee scanner_result.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: alpha-edge-scanner-result
          path: |
            scanner_result.json
            scanner_result.log
          if-no-files-found: warn
          retention-days: 7
