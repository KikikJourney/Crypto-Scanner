name: Zorathvael Dynamic Futures Scanner

on:
  push:
    branches: [main]
    paths:
      - 'scanner_v2.py'
      - 'universe_runner.py'
      - 'diagnostic_v21.py'
      - 'early_reversal_layer.py'
      - 'extreme_reversal_layer.py'
      - 'extreme_market_data.py'
      - 'extreme_runner.py'
      - 'extreme_event_stats.py'
      - 'actionable_reversal_layer.py'
      - 'actionable_forward_test.py'
      - 'telegram_notifier.py'
      - 'send_telegram_actions.py'
      - 'tests/test_early_reversal.py'
      - 'tests/test_extreme_reversal.py'
      - 'tests/test_actionable_reversal.py'
      - 'tests/test_actionable_forward_test.py'
      - 'tests/test_telegram_notifier.py'
      - '.github/workflows/reversal-scanner.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
concurrency:
  group: zorathvael-dynamic-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m py_compile scanner_v2.py universe_runner.py diagnostic_v21.py early_reversal_layer.py extreme_reversal_layer.py extreme_market_data.py extreme_runner.py extreme_event_stats.py actionable_reversal_layer.py actionable_forward_test.py telegram_notifier.py send_telegram_actions.py
      - name: Validate diagnostic
        run: python diagnostic_v21.py
      - name: Validate Early Reversal
        run: python -m unittest discover -s tests -p 'test_early_reversal.py' -v
      - name: Validate Extreme Reversal
        run: python -m unittest discover -s tests -p 'test_extreme_reversal.py' -v
      - name: Validate Actionable Reversal
        run: python -m unittest discover -s tests -p 'test_actionable_reversal.py' -v
      - name: Validate Actionable forward-test
        run: python -m unittest discover -s tests -p 'test_actionable_forward_test.py' -v
      - name: Validate Telegram formatter
        run: python -m unittest discover -s tests -p 'test_telegram_notifier.py' -v
      - name: Run dynamic futures scanner
        run: python universe_runner.py
      - name: Run V2.2 extreme reversal scanner
        run: python extreme_runner.py
      - name: Send confirmed actions to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram_actions.py
      - name: Validate generated datasets
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          def rows(path):
              with Path(path).open(newline='',encoding='utf-8') as f: return list(csv.DictReader(f))
          p=Path('data/extreme_reversal_forward_test.csv'); assert p.exists()
          r=rows(p)
          req={'id','timestamp','symbol','direction','score','price','atr_pct','trigger','action_stop','action_target','action_risk_pct','action_reward_r','event_id','event_role','h1','h4','h12','h24'}
          assert req <= set(r[0] if r else req)
          if r:
              ids={x['event_id'] for x in r}; primary={x['event_id'] for x in r if x['event_role']=='PRIMARY'}
              assert all(x['event_id'] for x in r) and all(x['event_role'] in {'PRIMARY','DUPLICATE'} for x in r) and ids==primary
          p=Path('data/extreme_market_snapshots.csv'); assert p.exists()
          r=rows(p); assert {'id','timestamp','symbol','provider','price'} <= set(r[0] if r else {'id','timestamp','symbol','provider','price'})
          p=Path('data/actionable_forward_test.csv'); assert p.exists()
          r=rows(p); req={'id','timestamp','symbol','provider','direction','extreme_event_id','entry','stop','target','risk_pct','reward_r','source_extreme_score','event_id','event_role','h1','h4','h12','h24'}
          assert req <= set(r[0] if r else req)
          if r:
              ids={x['event_id'] for x in r}; primary={x['event_id'] for x in r if x['event_role']=='PRIMARY'}
              assert all(x['event_id'] for x in r) and all(x['event_role'] in {'PRIMARY','DUPLICATE'} for x in r) and ids==primary
              assert all(float(x['entry'])>0 and float(x['stop'])>0 and float(x['target'])>0 for x in r)
          p=Path('data/actionable_signals.csv'); assert p.exists()
          r=rows(p); req={'id','timestamp','symbol','provider','direction','score','entry','trigger','stop','target','risk_pct','reward_r','reason'}
          assert req <= set(r[0] if r else req); assert all(x['direction'] in {'LONG','SHORT'} for x in r)
          print(f'VALID: extreme={len(rows("data/extreme_reversal_forward_test.csv"))}, actionable={len(rows("data/actionable_forward_test.csv"))}, telegram_actions={len(rows("data/actionable_signals.csv"))}')
          PY
      - name: Persist scanner and forward-test data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner_v2.py universe_runner.py diagnostic_v21.py early_reversal_layer.py extreme_reversal_layer.py extreme_market_data.py extreme_runner.py extreme_event_stats.py actionable_reversal_layer.py actionable_forward_test.py telegram_notifier.py send_telegram_actions.py tests/test_early_reversal.py tests/test_extreme_reversal.py tests/test_actionable_reversal.py tests/test_actionable_forward_test.py tests/test_telegram_notifier.py data/reversal_forward_test.csv data/early_reversal_forward_test.csv data/extreme_reversal_forward_test.csv data/extreme_market_snapshots.csv data/actionable_forward_test.csv data/universe_watchlist.csv data/actionable_signals.csv data/telegram_sent_actions.csv
          git diff --cached --quiet || git commit -m 'Measure confirmed fixed-entry actions'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
