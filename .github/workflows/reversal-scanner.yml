name: Zorathvael Dynamic Futures Scanner

on:
  push:
    branches: [main]
    paths:
      - 'scanner_v2.py'
      - 'universe_runner.py'
      - 'diagnostic_v21.py'
      - 'early_reversal_layer.py'
      - 'extreme_reversal_layer.py'
      - 'extreme_market_data.py'
      - 'extreme_runner.py'
      - 'extreme_event_stats.py'
      - 'actionable_reversal_layer.py'
      - 'tests/test_actionable_reversal.py'
      - '.github/workflows/reversal-scanner.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: zorathvael-dynamic-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate scanner syntax
        run: python -m py_compile scanner_v2.py universe_runner.py diagnostic_v21.py early_reversal_layer.py extreme_reversal_layer.py extreme_market_data.py extreme_runner.py extreme_event_stats.py actionable_reversal_layer.py

      - name: Validate diagnostic layer
        run: python diagnostic_v21.py

      - name: Validate Early Reversal layer
        run: python -m unittest discover -s tests -p 'test_early_reversal.py' -v

      - name: Validate Extreme Reversal layer
        run: python -m unittest discover -s tests -p 'test_extreme_reversal.py' -v

      - name: Validate Actionable Reversal layer
        run: python -m unittest discover -s tests -p 'test_actionable_reversal.py' -v

      - name: Run dynamic futures scanner
        run: python universe_runner.py

      - name: Run V2.2 extreme reversal scanner
        run: python extreme_runner.py

      - name: Validate watchlist CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('data/universe_watchlist.csv')
          assert p.exists(), 'watchlist CSV missing'
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert rows, 'watchlist CSV is empty'
          assert all(None not in r for r in rows), 'unexpected CSV fields detected'
          required = {
              'long_score','short_score','score_gap_to_70','bias','diagnostic_status','blocker',
              'long_blocker','short_blocker','long_location','long_exhaustion','long_flow',
              'long_reclaim','long_expansion','short_location','short_exhaustion','short_flow',
              'short_reject','short_expansion','early_status','early_score','early_direction','early_blocker'
          }
          assert required.issubset(rows[0]), 'V2.1 diagnostic/Early fields missing'
          print(f'WATCHLIST CSV VALID: {len(rows)} rows; V2.1 + Early Reversal fields present')
          PY

      - name: Validate Early forward-test CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('data/early_reversal_forward_test.csv')
          assert p.exists(), 'early forward-test CSV missing'
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          required = {'id','timestamp','symbol','direction','score','price','atr_pct','signal','h1','h4','h12','h24'}
          assert required.issubset(rows[0] if rows else required), 'early forward-test schema invalid'
          print(f'EARLY FORWARD CSV VALID: {len(rows)} rows')
          PY

      - name: Validate Extreme forward-test CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('data/extreme_reversal_forward_test.csv')
          assert p.exists(), 'extreme forward-test CSV missing'
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          required = {'id','timestamp','symbol','direction','score','price','atr_pct','signal','event_id','event_role','h1','h4','h12','h24'}
          assert required.issubset(rows[0] if rows else required), 'extreme forward-test schema invalid'
          if rows:
              event_ids={r['event_id'] for r in rows}
              primary_by_event={r['event_id']:0 for r in rows if r['event_role']=='PRIMARY'}
              assert all(r['event_id'] for r in rows), 'extreme event_id missing'
              assert all(r['event_role'] in {'PRIMARY','DUPLICATE'} for r in rows), 'invalid event_role'
              assert len(primary_by_event)==len(event_ids), 'each event must have exactly one PRIMARY'
          print(f'EXTREME FORWARD CSV VALID: {len(rows)} rows; event accounting present')
          p2 = Path('data/extreme_market_snapshots.csv')
          assert p2.exists(), 'extreme market snapshot CSV missing'
          with p2.open(newline='', encoding='utf-8') as f:
              snapshots = list(csv.DictReader(f))
          assert {'id','timestamp','symbol','provider','price'} <= set(snapshots[0] if snapshots else {'id','timestamp','symbol','provider','price'}), 'extreme snapshot schema invalid'
          print(f'EXTREME SNAPSHOT CSV VALID: {len(snapshots)} rows')
          PY

      - name: Persist scanner and forward-test data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner_v2.py universe_runner.py diagnostic_v21.py early_reversal_layer.py extreme_reversal_layer.py extreme_market_data.py extreme_runner.py extreme_event_stats.py actionable_reversal_layer.py tests/test_early_reversal.py tests/test_extreme_reversal.py tests/test_actionable_reversal.py data/reversal_forward_test.csv data/early_reversal_forward_test.csv data/extreme_reversal_forward_test.csv data/extreme_market_snapshots.csv data/universe_watchlist.csv
          git diff --cached --quiet || git commit -m 'Add actionable reversal confirmation layer'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
