name: Early Reversal Tests

on:
  push:
    paths:
      - 'scanner_v2.py'
      - 'tests/**'
      - '.github/workflows/early-reversal-tests.yml'
  pull_request:
    paths:
      - 'scanner_v2.py'
      - 'tests/**'
      - '.github/workflows/early-reversal-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile scanner_v2.py tests/test_early_reversal.py
      - run: python tests/test_early_reversal.py
