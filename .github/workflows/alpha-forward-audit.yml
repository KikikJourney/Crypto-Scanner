name: Alpha Forward Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'
  pull_request:
    branches: [main]
    paths:
      - 'alpha_forward_audit.py'
      - '.github/workflows/alpha-forward-audit.yml'
      - 'requirements.txt'

permissions:
  actions: read
  contents: read

concurrency:
  group: alpha-forward-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Collect recent Alpha artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/alpha_artifacts data/alpha_history
          mkdir -p /tmp/alpha_artifacts data/alpha_history

          python - <<'PY'
          import json, os, subprocess, urllib.request, zipfile
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "Crypto-Scanner-Alpha-Forward-Audit",
          }

          artifacts = []
          for page in range(1, 4):
              url = f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.load(resp)
              batch = payload.get("artifacts", [])
              artifacts.extend(batch)
              if len(batch) < 100:
                  break

          candidates = [
              a for a in artifacts
              if a.get("name", "").startswith("alpha-opportunity-")
              and not a.get("expired", False)
          ]
          candidates.sort(key=lambda a: a.get("created_at", ""), reverse=True)
          candidates = candidates[:24]

          if not candidates:
              raise SystemExit("No non-expired Alpha opportunity artifacts found.")

          outdir = Path("/tmp/alpha_artifacts")
          for a in candidates:
              aid = a["id"]
              name = a["name"]
              url = f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip"
              archive = outdir / f"{aid}.zip"
              import requests
              response = requests.get(url, headers=headers, timeout=60, allow_redirects=True)
              response.raise_for_status()
              archive.write_bytes(response.content)

              extract = outdir / str(aid)
              extract.mkdir()
              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(extract)

              for csv_path in extract.rglob("alpha_opportunity_watch.csv"):
                  target = Path("data/alpha_history") / f"{aid}.csv"
                  target.write_bytes(csv_path.read_bytes())

          print(f"Collected {len(candidates)} Alpha artifacts.")
          print("\n".join(f'{a["id"]} {a["created_at"]} {a["name"]}' for a in candidates))
          PY

      - name: Build deduplicated Alpha history
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          src = sorted(Path("data/alpha_history").glob("*.csv"))
          rows = {}
          for path in src:
              with path.open(newline="", encoding="utf-8") as f:
                  for row in csv.DictReader(f):
                      key = (row["timestamp"], row["symbol"], row["direction"])
                      rows[key] = row

          out = Path("data/alpha_opportunity_watch.csv")
          fields = [
              "timestamp","symbol","price","direction","state","alpha_score",
              "return_15m","return_1h","atr_pct","range_pos","volume_ratio",
              "breakout","pullback","momentum","mean_reversion","reason"
          ]
          ordered = sorted(rows.values(), key=lambda r: r["timestamp"])
          with out.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(ordered)

          print(f"Historical Alpha signals collected: {len(ordered)}")
          if not ordered:
              raise SystemExit("Alpha history is empty.")
          PY

      - name: Run Alpha forward audit
        run: python alpha_forward_audit.py

      - name: Validate audit output
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("data/alpha_forward_audit.csv")
          with path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          assert rows, "Alpha forward audit produced no rows"
          allowed = {"PENDING", "COMPLETE"} | {x for r in rows for x in [r["status"]]}
          complete = [r for r in rows if r["status"] == "COMPLETE"]
          follow = [r for r in complete if r["result_2h"] == "FOLLOW_THROUGH"]

          print(f"Alpha audit rows: {len(rows)}")
          print(f"Complete 2h outcomes: {len(complete)}")
          print(f"2h follow-through: {len(follow)}")
          if complete:
              print(f"2h follow-through rate: {len(follow)/len(complete):.1%}")
          for state in ("ALPHA_READY_SHADOW", "DEVELOPING", "WATCH"):
              bucket = [r for r in complete if r["state"] == state]
              if bucket:
                  hits = sum(r["result_2h"] == "FOLLOW_THROUGH" for r in bucket)
                  print(f"{state}: {hits}/{len(bucket)} = {hits/len(bucket):.1%}")
          PY

      - name: Upload Alpha audit
        uses: actions/upload-artifact@v4
        with:
          name: alpha-forward-audit-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            data/alpha_forward_audit.csv
            data/alpha_opportunity_watch.csv
