name: Alpha Edge Validation CI

on:
  push:
    branches: [main]
    paths:
      - 'alpha_edge_engine.py'
      - 'gemini_market_screen.py'
      - 'tests/test_gemini_market_screen.py'
      - 'scanner_council.py'
      - 'tests/test_alpha_edge_engine.py'
      - 'requirements.txt'
      - '.github/workflows/validation-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile production engine
        run: python -m py_compile alpha_edge_engine.py scanner_council.py gemini_market_screen.py
      - name: Run production unit tests
        run: |
          python -m unittest discover -s tests -p 'test_alpha_edge_engine.py' -v
          python -m unittest discover -s tests -p 'test_gemini_market_screen.py' -v
