name: Scanner Validation CI

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile scanner modules
        run: |
          python -m py_compile             scanner_v2.py universe_runner.py diagnostic_v21.py             early_reversal_layer.py extreme_reversal_layer.py extreme_market_data.py             extreme_runner.py extreme_event_stats.py actionable_reversal_layer.py             actionable_forward_test.py scalping_execution_layer.py scalping_intelligence.py             early_reversal_engine.py scalping_forward_test.py telegram_notifier.py             send_telegram_actions.py signal_funnel_diagnostic.py scalping_optimizer.py             validation_gate.py evidence_audit.py execution_calibration.py execution_retest_calibration.py execution_entry_location_40.py             extreme_archive_integrity.py traderspy_blueprint.py
      - name: Run full unit-test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate statistical evidence module
        run: python validation_gate.py
      - name: Validate execution retest calibration module
        run: python -m unittest discover -s tests -p 'test_execution_retest_calibration.py' -v
      - name: Validate extreme archive integrity module
        run: python -m unittest discover -s tests -p 'test_extreme_archive_integrity.py' -v
