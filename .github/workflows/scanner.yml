name: Zorathvael Crypto Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate scanner syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("scanner.py")
          s=p.read_text()
          s=s.replace('return features(list(reversed(bybit("/v5/market/kline",{"category":"linear","symbol":"BTCUSDT","interval":"60","limit":25})["result"]["list"]))))[1]', 'return features(list(reversed(bybit("/v5/market/kline",{"category":"linear","symbol":"BTCUSDT","interval":"60","limit":25})["result"]["list"]))) [1]')
          p.write_text(s)
          PY
          python -m py_compile scanner.py
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
