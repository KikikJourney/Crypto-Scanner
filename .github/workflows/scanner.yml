name: Legacy Scanner (Manual Only)

# The production path is .github/workflows/reversal-scanner.yml.
# This legacy workflow is intentionally manual-only so it cannot race the
# production persistence workflow or overwrite current research evidence.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate scanner syntax
        run: python -m py_compile scanner.py
      - name: Run legacy scanner without persistence
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
